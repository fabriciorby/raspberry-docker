x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  n8n:
    logging: *default-logging
    image: docker.n8n.io/n8nio/n8n:stable
    container_name: n8n
    restart: always
    ports:
      - "5678:5678"
    labels:
      - homepage.group=Apps
      - homepage.name=N8N
      - homepage.icon=n8n.svg
      - homepage.href=https://${SUBDOMAIN}.${DOMAIN_NAME}
      - homepage.description=N8N
      - traefik.enable=true
      - traefik.http.routers.n8n.rule=Host(`${SUBDOMAIN}.${DOMAIN_NAME}`)
      - traefik.http.routers.n8n.tls=true
      - traefik.http.routers.n8n.entrypoints=web,websecure
      - traefik.http.routers.n8n.tls.certresolver=mytlschallenge
      - traefik.http.middlewares.n8n.headers.SSLRedirect=true
      - traefik.http.middlewares.n8n.headers.STSSeconds=315360000
      - traefik.http.middlewares.n8n.headers.browserXSSFilter=true
      - traefik.http.middlewares.n8n.headers.contentTypeNosniff=true
      - traefik.http.middlewares.n8n.headers.forceSTSHeader=true
      - traefik.http.middlewares.n8n.headers.SSLHost=${DOMAIN_NAME}
      - traefik.http.middlewares.n8n.headers.STSIncludeSubdomains=true
      - traefik.http.middlewares.n8n.headers.STSPreload=true
      # Proxied through Cloudflare: fail2ban only saw Cloudflare IPs, so access is limited to Cloudflare/LAN/WireGuard
      # and login brute force is rate limited at Cloudflare instead
      - traefik.http.middlewares.n8n-allowlist.ipallowlist.sourcerange=${CLOUDFLARE_IPS},192.168.0.0/16,10.13.13.0/24
      - traefik.http.routers.n8n.middlewares=n8n-allowlist@docker,n8n@docker
      - traefik.http.routers.n8n-by.rule=Host(`${SUBDOMAIN}.${DOMAIN_NAME_NEW}`)
      - traefik.http.routers.n8n-by.tls=true
      - traefik.http.routers.n8n-by.entrypoints=web,websecure
      - traefik.http.routers.n8n-by.tls.certresolver=mytlschallenge
      - traefik.http.routers.n8n-by.middlewares=n8n-allowlist@docker,n8n@docker
    environment:
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_HOST=${SUBDOMAIN}.${DOMAIN_NAME}
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      # Cloudflare + Traefik
      - N8N_PROXY_HOPS=2
      - N8N_RUNNERS_ENABLED=true
      - N8N_TELEMETRY_ENABLED=false
      - NODE_ENV=production
      - WEBHOOK_URL=https://${SUBDOMAIN}.${DOMAIN_NAME}/
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE}
      - TZ=${GENERIC_TIMEZONE}
    volumes:
      - ${DOCKER_DIR}/n8n/data:/home/node/.n8n
      - ${DOCKER_DIR}/n8n/files:/files
    networks:
      - apps_infra_net

  syncthing:
    logging: *default-logging
    image: lscr.io/linuxserver/syncthing:latest
    container_name: syncthing
    labels:
      - homepage.group=Apps
      - homepage.name=Syncthing
      - homepage.icon=syncthing.svg
      - homepage.href=${RASPBERRY_ADDRESS}:8384
      - homepage.description=Sync things
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${GENERIC_TIMEZONE}
    volumes:
      - ${DOCKER_DIR}/syncthing/config:/config
      - ${DOCKER_DIR}:/docker
      - /mnt/drive/sync:/sync
    ports:
      - 8384:8384
      - 22000:22000/tcp
      - 22000:22000/udp
      - 21027:21027/udp
    restart: unless-stopped

  your_spotify:
    logging: *default-logging
    image: lscr.io/linuxserver/your_spotify:latest
    container_name: your_spotify
    labels:
      - homepage.group=Apps
      - homepage.name=Your Spotify
      - homepage.icon=spotify.svg
      - homepage.href=https://spotify.${DOMAIN_NAME}
      - homepage.description=Check your Spotify stats
      - traefik.enable=true
      - traefik.http.routers.spotify.rule=Host(`spotify.${DOMAIN_NAME}`)
      - traefik.http.routers.spotify.tls=true
      - traefik.http.routers.spotify.entrypoints=web,websecure
      - traefik.http.routers.spotify.tls.certresolver=mytlschallenge
      # Segundo Domínio (.by)
      - traefik.http.routers.spotify-by.rule=Host(`spotify.${DOMAIN_NAME_NEW}`)
      - traefik.http.routers.spotify-by.tls=true
      - traefik.http.routers.spotify-by.entrypoints=web,websecure
      - traefik.http.routers.spotify-by.tls.certResolver=mytlschallenge
      - traefik.http.routers.spotify-by.middlewares=spotify@docker

      - traefik.http.middlewares.spotify.headers.SSLRedirect=true
      - traefik.http.middlewares.spotify.headers.STSSeconds=315360000
      - traefik.http.middlewares.spotify.headers.browserXSSFilter=true
      - traefik.http.middlewares.spotify.headers.contentTypeNosniff=true
      - traefik.http.middlewares.spotify.headers.forceSTSHeader=true
      # - traefik.http.middlewares.spotify.headers.SSLHost=${DOMAIN_NAME}
      - traefik.http.middlewares.spotify.headers.STSIncludeSubdomains=true
      - traefik.http.middlewares.spotify.headers.STSPreload=true
      - traefik.http.routers.spotify.middlewares=spotify@docker
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${GENERIC_TIMEZONE}
      - APP_URL=https://spotify.${DOMAIN_NAME}
      - SPOTIFY_PUBLIC=${SPOTIFY_PUBLIC}
      - SPOTIFY_SECRET=${SPOTIFY_SECRET}
      - CORS=http://spotify.${DOMAIN_NAME}:80,https://spotify.${DOMAIN_NAME}:443,http://spotify.${DOMAIN_NAME_NEW}:80,https://spotify.${DOMAIN_NAME_NEW}:443
      - MONGO_ENDPOINT=mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@mongo:27017/spotify?authSource=admin
      - LOG_LEVEL=info
    ports:
      - 8123:80
      - 8124:443
    restart: unless-stopped
    networks:
      - apps_infra_net
    depends_on: 
      - mongo

  mongo:
    logging: *default-logging
    # Mongo 8 crashes on the 39-bit kernel8.img, which Immich's Redis needs (16K pages break jemalloc)
    image: 'mongo:7.0'
    container_name: mongo
    restart: unless-stopped
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
    volumes:
      - ${DOCKER_DIR}/mongo/db:/data/db
    networks:
      - apps_infra_net

networks:
  apps_infra_net:
    name: apps_infra_net
    driver: bridge
