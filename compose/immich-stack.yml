#
# WARNING: To install Immich, follow our guide: https://docs.immich.app/install/docker-compose
#
# Make sure to use the docker-compose.yml of the current release:
#
# https://github.com/immich-app/immich/releases/latest/download/docker-compose.yml
#
# The compose file on main may not be compatible with the latest release.

#name: immich

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  immich-server:
    logging: *default-logging
    container_name: immich_server
    labels:
      - homepage.group=Immich
      - homepage.name=Immich
      - homepage.icon=immich.svg
      - homepage.href=${RASPBERRY_ADDRESS}:2283
      - homepage.description=Self hosted Google Photos
      - homepage.widget.type=immich
      - homepage.widget.url=${RASPBERRY_ADDRESS}:2283
      - homepage.widget.key=${IMMICH_API_KEY}
      - homepage.widget.fields=["users","photos","videos","storage"]
      - homepage.widget.version=2
      - traefik.enable=true
      - traefik.docker.network=immich_infra_net
      - traefik.http.routers.immich.rule=Host(`photos.${DOMAIN_NAME}`)
      - traefik.http.routers.immich.tls=true
      - traefik.http.routers.immich.entrypoints=web,websecure
      - traefik.http.routers.immich.tls.certresolver=mytlschallenge
      - traefik.http.services.immich.loadbalancer.server.port=2283
      - traefik.http.middlewares.immich.headers.SSLRedirect=true
      - traefik.http.middlewares.immich.headers.STSSeconds=315360000
      - traefik.http.middlewares.immich.headers.browserXSSFilter=true
      - traefik.http.middlewares.immich.headers.contentTypeNosniff=true
      - traefik.http.middlewares.immich.headers.forceSTSHeader=true
      - traefik.http.middlewares.immich.headers.STSIncludeSubdomains=true
      - traefik.http.middlewares.immich.headers.STSPreload=true
      # DNS-only (grey cloud) so uploads skip Cloudflare's 100 MB limit, which lets fail2ban see real client IPs.
      # maxretry is looser than the other services because an expired session fires a burst of 401s; LAN/WireGuard can't be banned
      - traefik.http.middlewares.fail2ban-immich.plugin.fail2ban.allowlist.ip=::1,127.0.0.1,192.168.0.0/16,10.13.13.0/24
      - traefik.http.middlewares.fail2ban-immich.plugin.fail2ban.rules.bantime=30m
      - traefik.http.middlewares.fail2ban-immich.plugin.fail2ban.rules.enabled=true
      - traefik.http.middlewares.fail2ban-immich.plugin.fail2ban.rules.findtime=10m
      - traefik.http.middlewares.fail2ban-immich.plugin.fail2ban.rules.maxretry=10
      - traefik.http.middlewares.fail2ban-immich.plugin.fail2ban.rules.statuscode=401
      - traefik.http.routers.immich.middlewares=immich@docker,fail2ban-immich@docker
      - traefik.http.routers.immich-by.rule=Host(`photos.${DOMAIN_NAME_NEW}`)
      - traefik.http.routers.immich-by.tls=true
      - traefik.http.routers.immich-by.entrypoints=web,websecure
      - traefik.http.routers.immich-by.tls.certresolver=mytlschallenge
      - traefik.http.routers.immich-by.service=immich
      - traefik.http.routers.immich-by.middlewares=immich@docker,fail2ban-immich@docker
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    # extends:
    #   file: hwaccel.transcoding.yml
    #   service: cpu # set to one of [nvenc, quicksync, rkmpp, vaapi, vaapi-wsl] for accelerated transcoding
    volumes:
      # Do not edit the next line. If you want to change the media storage location on your system, edit the value of UPLOAD_LOCATION in the .env file
      - ${UPLOAD_LOCATION}:/data
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - ../.env
    ports:
      - '2283:2283'
    networks:
      - default
      - immich_infra_net
    depends_on:
      - redis
      - database
    restart: always
    healthcheck:
      disable: false

  immich-machine-learning:
    logging: *default-logging
    container_name: immich_machine_learning
    # For hardware acceleration, add one of -[armnn, cuda, rocm, openvino, rknn] to the image tag.
    # Example tag: ${IMMICH_VERSION:-release}-cuda
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}
    # extends: # uncomment this section for hardware acceleration - see https://docs.immich.app/features/ml-hardware-acceleration
    #   file: hwaccel.ml.yml
    #   service: cpu # set to one of [armnn, cuda, rocm, openvino, openvino-wsl, rknn] for accelerated inference - use the `-wsl` version for WSL2 where applicable
    volumes:
      - model-cache:/cache
    env_file:
      - ../.env
    restart: always
    healthcheck:
      disable: false

  redis:
    logging: *default-logging
    container_name: immich_redis
    image: docker.io/valkey/valkey:8@sha256:81db6d39e1bba3b3ff32bd3a1b19a6d69690f94a3954ec131277b9a26b95b3aa
    healthcheck:
      test: redis-cli ping || exit 1
    restart: always

  database:
    logging: *default-logging
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
      # Uncomment the DB_STORAGE_TYPE: 'HDD' var if your database isn't stored on SSDs
      # DB_STORAGE_TYPE: 'HDD'
    volumes:
      # Do not edit the next line. If you want to change the database storage location on your system, edit the value of DB_DATA_LOCATION in the .env file
      - ${DB_DATA_LOCATION}:/var/lib/postgresql/data
    shm_size: 128mb
    restart: always

volumes:
  model-cache:

networks:
  immich_infra_net:
    name: immich_infra_net
    driver: bridge
