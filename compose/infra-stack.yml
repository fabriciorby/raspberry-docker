x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  watchtower:
    logging: *default-logging
    # Maintained fork; containrrr/watchtower is unmaintained and too old for Docker 29's API
    image: nickfedor/watchtower
    container_name: watchtower
    restart: unless-stopped
    environment:
      - WATCHTOWER_CLEANUP=true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  portainer:
    logging: *default-logging
    container_name: portainer
    image: portainer/portainer-ce:latest
    labels:
      - homepage.group=Infra
      - homepage.name=Portainer
      - homepage.icon=portainer.svg
      - homepage.href=https://${RASPBERRY_IP}:9443
      - homepage.description=Docker Management
      - homepage.widget.type=portainer
      - homepage.widget.url=https://${RASPBERRY_IP}:9443
      - homepage.widget.env=3
      - homepage.widget.key=${PORTAINER_API_KEY}
    ports:
      - 9443:9443
    volumes:
      - ${DOCKER_DIR}/portainer/data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  traefik:
    logging: *default-logging
    image: "traefik:v3"
    container_name: "traefik"
    restart: always
    labels:
      - homepage.group=Infra
      - homepage.name=Traefik
      - homepage.icon=traefik.svg
      - homepage.href=${RASPBERRY_ADDRESS}:8081
      - homepage.description=Docker Reverse Proxy
      - homepage.widget.type=traefik
      - homepage.widget.url=${RASPBERRY_ADDRESS}:8081
    command:
      # - "--log.level=DEBUG"
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      # Uses the Cloudflare DNS challenge despite the name, so certificates renew behind the Cloudflare proxy
      - "--certificatesresolvers.mytlschallenge.acme.dnschallenge.provider=cloudflare"
      - "--certificatesresolvers.mytlschallenge.acme.dnschallenge.resolvers=1.1.1.1:53,1.0.0.1:53"
      - "--certificatesresolvers.mytlschallenge.acme.email=${SSL_EMAIL}"
      - "--certificatesresolvers.mytlschallenge.acme.storage=/letsencrypt/acme.json"
      # Loaded from traefik/plugins-local so startup doesn't depend on downloading it
      - "--experimental.localPlugins.fail2ban.moduleName=github.com/tomMoulard/fail2ban"
    environment:
      - CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN}
    ports:
      - "80:80"
      - "443:443"
      - "8081:8080"
    volumes:
      - ${DOCKER_DIR}/traefik/data:/letsencrypt
      - ${DOCKER_DIR}/traefik/plugins-local:/plugins-local:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - infra_default
      - media_infra_net
      - apps_infra_net

  homepage:
      logging: *default-logging
      image: ghcr.io/gethomepage/homepage:latest
      container_name: homepage
      restart: unless-stopped
      user: root
      environment:
        - HOMEPAGE_ALLOWED_HOSTS=${RASPBERRY_IP}:3001
      volumes:
        # Pasta onde ficarão as configurações do painel
        - ../homepage/config:/app/config 
        # Necessário para ele "ler" os outros containers do Docker
        - /var/run/docker.sock:/var/run/docker.sock:ro
        # Discos mostrados no widget de recursos
        - /mnt/media:/mnt/media:ro
        - /mnt/drive:/mnt/drive:ro
      # Como você usa Traefik, não precisa abrir portas, basta colocar as labels do Traefik aqui:
      ports:
       - "3001:3000"
      networks:
        - infra_default
        - media_infra_net
        - apps_infra_net

networks:
  infra_default:
    external: true
  media_infra_net:
    external: true
  apps_infra_net:
    external: true
