x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  gluetun:
    logging: *default-logging
    image: qmcgaw/gluetun
    container_name: gluetun
    labels:
      - homepage.group=Torrent
      - homepage.name=Gluetun
      - homepage.icon=gluetun.svg
      - homepage.description=VPN
      - homepage.widget.type=gluetun
      - homepage.widget.url=${RASPBERRY_ADDRESS}:8000
      - homepage.widget.key=${GLUETUN_API_KEY}
      - homepage.widget.version=2
    environment:
      - VPN_SERVICE_PROVIDER=mullvad
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      - WIREGUARD_ADDRESSES=${WIREGUARD_ADDRESSES}
      - SERVER_CITIES=Zurich
      # Control server API (used by the Homepage widget)
      - HTTP_CONTROL_SERVER_AUTH_DEFAULT_ROLE={"auth":"apikey","apikey":"${GLUETUN_API_KEY}"}
    cap_add:
      - NET_ADMIN
    ports:
      - 8000:8000
      - 8080:8080
      - 6881:6881
      - 6881:6881/udp
    restart: unless-stopped

  qbittorrent:
    logging: *default-logging
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    labels:
      - homepage.group=Torrent
      - homepage.name=qBittorrent
      - homepage.icon=qbittorrent.svg
      - homepage.href=${RASPBERRY_ADDRESS}:8080
      - homepage.description=Torrent
      - homepage.widget.type=qbittorrent
      - homepage.widget.url=${RASPBERRY_ADDRESS}:8080
      - homepage.widget.username=${QBITTORRENT_USERNAME}
      - homepage.widget.password=${QBITTORRENT_PASSWORD}
      - homepage.widget.enableLeechProgress=true
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${GENERIC_TIMEZONE}
      - WEBUI_PORT=8080
      - TORRENTING_PORT=6881
    volumes:
      - ${DOCKER_DIR}/qbittorrent/appdata:/config
      - /mnt/media/data/torrents:/data/torrents
    restart: unless-stopped
    network_mode: "service:gluetun"

  # Stops downloads when the torrent disk has less than MIN_FREE_GB free
  qbit-diskguard:
    logging: *default-logging
    image: curlimages/curl:8.11.1
    container_name: qbit-diskguard
    user: ${PUID}:${PGID}
    entrypoint: ["/bin/sh", "/qbit-diskguard.sh"]
    environment:
      - TZ=${GENERIC_TIMEZONE}
      - QBITTORRENT_USERNAME=${QBITTORRENT_USERNAME}
      - QBITTORRENT_PASSWORD=${QBITTORRENT_PASSWORD}
      - MIN_FREE_GB=50
      - RESUME_FREE_GB=55
    volumes:
      - ../scripts/qbit-diskguard.sh:/qbit-diskguard.sh:ro
      - ${DOCKER_DIR}/qbit-diskguard:/state
      - /mnt/media/data/torrents:/data/torrents:ro
    restart: unless-stopped
    network_mode: "service:gluetun"
    depends_on:
      - qbittorrent
